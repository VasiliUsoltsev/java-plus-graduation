server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ewm-event
    username: ewm
    password: ewm
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  sql:
    init:
      mode: always
  openfeign:
    circuitbreaker:
      enabled: true
    client:
      config:
        default:
          loggerLevel: basic
          connectTimeout: 2000
          readTimeout: 3000

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        timeout-duration: 3s

stat:
  app:
    name: ewm-event-service
  service:
    id: stats-server