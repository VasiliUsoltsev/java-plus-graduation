server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: main-service-admin
          uri: lb://main-service
          predicates:
            - Path=/admin/**

        - id: main-service-public
          uri: lb://main-service
          predicates:
            - Path=/categories/**,/compilations/**,/events/**

        - id: main-service-private
          uri: lb://main-service
          predicates:
            - Path=/users/**
