server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: comment-service-admin
          uri: lb://comment-service
          predicates:
            - Path=/admin/comments/**

        - id: comment-service-private
          uri: lb://comment-service
          predicates:
            - Path=/events/{eventId}/comments/**

        - id: request-service-private
          uri: lb://request-service
          predicates:
            - Path=/users/{userId}/requests/**

        - id: user-service-admin
          uri: lb://user-service
          predicates:
            - Path=/admin/users,/admin/users/**

        - id: event-service-admin
          uri: lb://event-service
          predicates:
            - Path=/admin/categories/**,/admin/compilations/**,/admin/events/**

        - id: event-service-public
          uri: lb://event-service
          predicates:
            - Path=/categories/**,/compilations/**,/events/**

        - id: event-service-private
          uri: lb://event-service
          predicates:
            - Path=/users/{userId}/events/**

        - id: stats-service-private
          uri: lb://stats-server
          predicates:
            - Path=/hit, /stats

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true