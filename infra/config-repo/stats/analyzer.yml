spring:
  main:
    web-application-type: none
  datasource:
    url: jdbc:postgresql://localhost:5432/ewm-analyzer
    username: ewm
    password: ewm
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  sql:
    init:
      mode: always

kafka:
  topic-user-action: "stats.user-actions.v1"
  group-user-action: "nalyzer-user-action-group"
  key-deserializer-user-action: "org.apache.kafka.common.serialization.LongDeserializer"
  value-deserializer-user-action: "ru.practicum.main.serialization.deserializer.UserActionAvroDeserializer"

  topic-event-similarity: "stats.events-similarity.v1"
  group-event-similarity: "nalyzer-event-similarity-group"
  key-deserializer-event-similarity: "org.apache.kafka.common.serialization.LongDeserializer"
  value-deserializer-event-similarity: "ru.practicum.main.serialization.deserializer.EventSimilarityDeserializer"

  maxPoll: 100

grpc:
  server:
    port: 0
