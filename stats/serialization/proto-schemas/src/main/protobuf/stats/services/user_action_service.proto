syntax = "proto3";

package stats.service.collector;

option java_multiple_files = true;
option java_package = "ru.practicum.ewm.stats.grpc";
option java_outer_classname = "UserActionServiceProto";

import "stats/messages/user_action_messages.proto";
import "google/protobuf/empty.proto";

service UserActionController {
    rpc CollectUserAction(UserActionProto) returns (google.protobuf.Empty);
}